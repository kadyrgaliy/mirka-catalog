<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Бет табылмады · MirKa Digital</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 55%, #f64f59 100%);
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    text-align: center; padding: 24px;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 480px; }
  .num {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(100px, 20vw, 160px);
    font-weight: 300; line-height: 1;
    color: rgba(255,255,255,0.2);
    margin-bottom: 8px;
  }
  h1 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 28px; font-weight: 300;
    color: #fff; margin-bottom: 16px;
  }
  p {
    font-size: 14px; font-weight: 400; line-height: 1.7;
    color: rgba(255,255,255,0.7); margin-bottom: 40px;
  }
  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 14px 32px; border-radius: 100px;
    background: rgba(255,255,255,0.15);
    border: 1.5px solid rgba(255,255,255,0.35);
    color: #fff; text-decoration: none;
    font-size: 13px; font-weight: 500;
    letter-spacing: 0.05em;
    transition: background 0.2s ease;
  }
  .btn:hover { background: rgba(255,255,255,0.25); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="num">404</div>
    <h1>Бет табылмады</h1>
    <p>Сіз іздеген бет жоқ немесе жылжытылған.<br>Каталогқа оралып, прототипті таңдаңыз.</p>
    <a href="/" class="btn">← Каталогқа оралу</a>
  </div>
</body>
</html>
